services:
  backend:
    build: ./backend-drf
    ports:
      - "8000:8000"
    env_file:
      - ./backend-drf/.env
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

  frontend:
    build: ./frontend-react
    ports:
      - "5173:5173"
    env_file:
      - ./frontend-react/.env
    depends_on:
      - backend
